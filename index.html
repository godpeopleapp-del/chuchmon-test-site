<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추추몬AI 테스트 사이트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      color: #fff;
      background: #0a0a0a;
    }

    /* 히어로 섹션 — 이미지 배경 */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.3) 0%,
        rgba(0,0,0,0.2) 40%,
        rgba(0,0,0,0.75) 80%,
        rgba(10,10,10,1) 100%
      );
    }

    .hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .badge {
      background: rgba(124,58,237,0.35);
      border: 1px solid rgba(124,58,237,0.6);
      color: #c4b5fd;
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }

    p {
      font-size: clamp(14px, 2vw, 18px);
      color: rgba(255,255,255,0.75);
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(124,58,237,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124,58,237,0.6);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.2); }

    /* 통계 섹션 */
    .stats-section {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      padding: 60px 24px;
      display: flex;
      justify-content: center;
    }

    .stats {
      display: flex;
      gap: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat { text-align: center; }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-top: 6px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- 히어로: 이미지 배경 -->
  <section class="hero">
    <img class="hero-bg" src="제목없음.png" alt="배경 이미지" />
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="badge">✨ AI 기반 사이트 빌더</div>
      <h1>추추몬AI로<br />3분 만에 완성</h1>
      <p>자영업자를 위한 AI 템플릿 플랫폼. 클릭 한 번으로 나만의 웹 서비스를 즉시 발급받으세요.</p>
      <div class="btn-group">
        <button class="btn-primary">무료로 시작하기</button>
        <button class="btn-secondary">템플릿 둘러보기</button>
      </div>
    </div>
  </section>

  <!-- 통계 -->
  <section class="stats-section">
    <div class="stats">
      <div class="stat">
        <div class="stat-value">12,000+</div>
        <div class="stat-label">활성 사이트</div>
      </div>
      <div class="stat">
        <div class="stat-value">3분</div>
        <div class="stat-label">평균 완성 시간</div>
      </div>
      <div class="stat">
        <div class="stat-value">98%</div>
        <div class="stat-label">고객 만족도</div>
      </div>
    </div>
  </section>

</body>
</html>
